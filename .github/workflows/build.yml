name: Build LCSwitcher

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LCSwitcher (.dylib / .deb / .zip)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LCSwitcher-artifacts
          path: |
            LCSwitcher.dylib
            LCSwitcher.plist
            LCSwitcher_*.deb
            LCSwitcher.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LCSwitcher.dylib
            LCSwitcher_*.deb
            LCSwitcher.zip
